# HTTP virtual host replacing /etc/zabbix/nginx.conf of zabbix-web-nginx-pgsql image.
# Redirects everything to HTTPS (LAN access; public access comes through Cloudflare Tunnel to 8443).
server {
    listen 8080;
    include /etc/nginx/includes/listen-ipv6.conf;

    include /etc/nginx/includes/access-log.conf;
    error_log       stderr notice;

    # Container healthcheck
    location = /ping {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        fastcgi_pass                    unix:/tmp/php-fpm.sock;

        fastcgi_param  SCRIPT_FILENAME  /usr/share/zabbix$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
