zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 3a6730e62a4f4685831df097d40f3044
      name: Templates/Likson
  templates:
    - uuid: 228e7e1892384f9eac3999cfe11c1961
      template: 'ISP gateway fast ping'
      name: 'ISP gateway fast ping'
      description: |
        Fast ping to the gateway of an internet provider, to detect outages shorter than one minute that the
        "ICMP Ping" template (one check per minute, alert after 3 failures) misses. Linked together with "ICMP Ping"
        to the hosts of group "Proveedores de internet". See docs/operacion/procedimientos/anadir-gateway-proveedor.md.
      groups:
        - name: Templates/Likson
      items:
        - uuid: 834dbf3ea7e64ad3b481c6ac592daaf1
          name: 'Ping rápido al gateway'
          type: SIMPLE
          key: 'icmpping[,{$ISP.PING.COUNT},200,,500]'
          delay: '{$ISP.PING.INTERVAL}'
          history: 31d
          valuemap:
            name: 'Service state'
          description: '{$ISP.PING.COUNT} packets every {$ISP.PING.INTERVAL}, 500 ms timeout. 1 = at least one reply.'
          tags:
            - tag: component
              value: isp
        - uuid: f58f975881de4577b775dc5ff14ff7b0
          name: 'Pérdida en ping rápido'
          type: SIMPLE
          key: 'icmppingloss[,{$ISP.PING.COUNT},200,,500]'
          delay: '{$ISP.PING.INTERVAL}'
          history: 31d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: isp
      macros:
        - macro: '{$ISP.PING.INTERVAL}'
          value: 5s
          description: 'Interval of the fast ping.'
        - macro: '{$ISP.PING.COUNT}'
          value: '3'
          description: 'Packets per check.'
        - macro: '{$ISP.LOSS.CHECKS}'
          value: '3'
          description: 'Checks with packet loss within 5 minutes that open "Intermittent packet loss" (informative).'
        - macro: '{$ISP.CUT.LOSS}'
          value: '33'
          description: 'Packet loss (%) averaged over 1 minute that is a real outage for Likson ("Corte" triggers, notified to Likson).'
        - macro: '{$ISP.CUT.LOSS.RECOVERY}'
          value: '10'
          description: 'Average 1-minute loss (%) below which the outage is resolved.'
        - macro: '{$ISP.PROVIDER.LOSS}'
          value: '50'
          description: 'Average 5-minute loss (%) that is notified to the provider.'
        - macro: '{$ISP.PROVIDER.LOSS.RECOVERY}'
          value: '20'
          description: 'Average 5-minute loss (%) below which the provider loss notice is resolved.'
      valuemaps:
        - uuid: 80a7dfe945984a51ad0709067bd2f1e1
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
  triggers:
    - uuid: dd06a5d49efa4d77b3e78c5a6d223b58
      expression: 'avg(/ISP gateway fast ping/icmppingloss[,{$ISP.PING.COUNT},200,,500],1m)>{$ISP.CUT.LOSS}'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'avg(/ISP gateway fast ping/icmppingloss[,{$ISP.PING.COUNT},200,,500],1m)<{$ISP.CUT.LOSS.RECOVERY}'
      name: 'Corte del proveedor: el gateway no responde'
      event_name: 'Corte del proveedor: {HOST.NAME} no responde'
      opdata: 'Pérdida en 1 min: {{?avg(/{HOST.HOST}/icmppingloss[,{$ISP.PING.COUNT},200,,500],1m)}.fmtnum(0)}%'
      priority: HIGH
      description: 'Corte real para Likson: pérdida media de más del {$ISP.CUT.LOSS} % en 1 minuto hacia el gateway (ping cada 5 s). Una comprobación aislada fallida no lo abre. Se resuelve con menos del {$ISP.CUT.LOSS.RECOVERY} %. Cruzar con el puerto WAN de EDGE 01: si sigue arriba, la falla es del proveedor.'
      tags:
        - tag: scope
          value: 'availability'
    - uuid: 6da8771c29134522a01f00459ac631a3
      expression: 'count(/ISP gateway fast ping/icmppingloss[,{$ISP.PING.COUNT},200,,500],5m,"gt",0)>={$ISP.LOSS.CHECKS}'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'count(/ISP gateway fast ping/icmppingloss[,{$ISP.PING.COUNT},200,,500],5m,"gt",0)=0'
      name: 'Pérdida intermitente hacia el gateway'
      opdata: 'Pérdida actual: {ITEM.LASTVALUE1}'
      priority: INFO
      description: 'Comprobaciones con pérdida de paquetes en 5 minutos. Solo informativo (no notifica): la pérdida suelta de ICMP es habitual.'
      dependencies:
        - name: 'Corte del proveedor: el gateway no responde'
          expression: 'avg(/ISP gateway fast ping/icmppingloss[,{$ISP.PING.COUNT},200,,500],1m)>{$ISP.CUT.LOSS}'
          recovery_expression: 'avg(/ISP gateway fast ping/icmppingloss[,{$ISP.PING.COUNT},200,,500],1m)<{$ISP.CUT.LOSS.RECOVERY}'
      tags:
        - tag: scope
          value: 'performance'
    - uuid: f8e4386421d34d5486d5c6b4d8714c92
      expression: 'max(/ISP gateway fast ping/icmpping[,{$ISP.PING.COUNT},200,,500],5m)=0'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'min(/ISP gateway fast ping/icmpping[,{$ISP.PING.COUNT},200,,500],#3)=1'
      name: 'Aviso al proveedor: gateway sin respuesta más de 5 min'
      priority: INFO
      description: 'Solo para el aviso automático al proveedor: ninguna comprobación respondió durante 5 minutos seguidos. Likson ya recibe el aviso de Corte.'
      tags:
        - tag: scope
          value: 'availability'
        - tag: aviso_proveedor
          value: 'El gateway del servicio no responde al ping desde hace más de 5 minutos (corte continuo)'
    - uuid: fa7322a617044e75b2401fada3a18917
      expression: 'avg(/ISP gateway fast ping/icmppingloss[,{$ISP.PING.COUNT},200,,500],5m)>={$ISP.PROVIDER.LOSS}'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'avg(/ISP gateway fast ping/icmppingloss[,{$ISP.PING.COUNT},200,,500],5m)<{$ISP.PROVIDER.LOSS.RECOVERY}'
      name: 'Aviso al proveedor: pérdida alta hacia el gateway durante 5 min'
      opdata: 'Pérdida media 5 min: {{?avg(/{HOST.HOST}/icmppingloss[,{$ISP.PING.COUNT},200,,500],5m)}.fmtnum(0)}%'
      priority: INFO
      description: 'Solo para el aviso automático al proveedor: pérdida media del {$ISP.PROVIDER.LOSS} % o más durante 5 minutos.'
      dependencies:
        - name: 'Aviso al proveedor: gateway sin respuesta más de 5 min'
          expression: 'max(/ISP gateway fast ping/icmpping[,{$ISP.PING.COUNT},200,,500],5m)=0'
          recovery_expression: 'min(/ISP gateway fast ping/icmpping[,{$ISP.PING.COUNT},200,,500],#3)=1'
      tags:
        - tag: scope
          value: 'performance'
        - tag: aviso_proveedor
          value: 'Pérdida de paquetes del 50 % o más hacia el gateway del servicio durante 5 minutos'
