    tags:
    - tag: scope
      value: performance
  - uuid: f4393a2faa224eed8390147ddfd154b2
    expression: max(/Ubiquiti AirOS 8 wireless by SNMPv1/ubnt.gps.sats.used,10m)<{$UBNT.GPS.SATS.MIN}
    name: 'GPS: Weak or lost signal (less than {$UBNT.GPS.SATS.MIN} satellites for
