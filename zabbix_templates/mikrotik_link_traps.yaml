zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 77382a6284d144ad86fb58ccf83d210d
      name: Templates/Network devices
  templates:
    - uuid: 9c326ee0053845d4a440d38f06296389
      template: 'MikroTik link traps by SNMP'
      name: 'MikroTik link traps by SNMP'
      description: |
        Immediate link down/up alerts from SNMP traps (IF-MIB::linkDown/linkUp) sent by MikroTik RouterOS.
        Discovers interfaces with a comment (ifAlias) and creates one SNMP trap item and trigger per interface.
        Traps carry only ifIndex, discovery maps it to interface name and comment.
        Router requirements: /snmp trap-target=<Zabbix>, trap-generators=interfaces and src-address equal to
        the host SNMP interface IP, otherwise traps are not matched to the host.
        Complements the polling "Link down" trigger of MikroTik templates (traps are UDP and can be lost).
      groups:
        - name: Templates/Network devices
      discovery_rules:
        - uuid: 8ad03345bcda455b838b8ed0cb5adef9
          name: 'Link trap interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.18]'
          key: mikrotik.linktrap.discovery
          delay: 1h
          lifetime: 7d
          description: 'Interfaces with a comment (ifAlias), dynamic interfaces <...> excluded.'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$LINKTRAP.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#IFALIAS}'
                value: '{$LINKTRAP.IFALIAS.MATCHES}'
                formulaid: B
          item_prototypes:
            - uuid: 1a238a424df14a138d4e74b54e3c6bd0
              name: 'Interface {#IFNAME}({#IFALIAS}): Link traps'
              type: SNMP_TRAP
              key: 'snmptrap["IF-MIB::ifIndex[.]{#SNMPINDEX} = "]'
              delay: '0'
              history: 31d
              value_type: LOG
              description: 'IF-MIB linkDown/linkUp traps for ifIndex {#SNMPINDEX}.'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 008c833ea07b40efafa240f6b9c794ac
                  expression: 'find(/MikroTik link traps by SNMP/snmptrap["IF-MIB::ifIndex[.]{#SNMPINDEX} = "],,"like","linkDown")=1 and find(/MikroTik link traps by SNMP/snmptrap["IF-MIB::ifIndex[.]{#SNMPINDEX} = "],,"regexp","ifAdminStatus[.][0-9]+ = 1")=1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'find(/MikroTik link traps by SNMP/snmptrap["IF-MIB::ifIndex[.]{#SNMPINDEX} = "],,"like","linkUp")=1'
                  name: 'Interface {#IFNAME}({#IFALIAS}): Link down (SNMP trap)'
                  opdata: 'ifIndex {#SNMPINDEX}'
                  priority: AVERAGE
                  description: 'linkDown trap received while the interface is administratively up. Resolved by linkUp trap; close manually if linkUp trap was lost.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: availability
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#IFNAME}'
                - 1.3.6.1.2.1.31.1.1.1.1
                - '0'
                - '{#IFALIAS}'
                - 1.3.6.1.2.1.31.1.1.1.18
                - '0'
      tags:
        - tag: class
          value: network
        - tag: target
          value: mikrotik
      macros:
        - macro: '{$LINKTRAP.IFALIAS.MATCHES}'
          value: '.+'
          description: 'Interfaces to alert on, by comment. Default: any interface with a comment.'
        - macro: '{$LINKTRAP.IFNAME.NOT_MATCHES}'
          value: '^<'
          description: 'Excluded interfaces. Default: dynamic interfaces (PPPoE, L2TP, SSTP...).'
