# Host temperature sensors (lm-sensors drivers, read from /sys/class/hwmon)
# Template: zabbix_templates/linux_hwmon_temperature.yaml
UserParameter=hwmon.temp.discovery,sh /etc/zabbix/zabbix_agentd.d/sensors_hwmon.sh discovery
UserParameter=hwmon.temp[*],sh /etc/zabbix/zabbix_agentd.d/sensors_hwmon.sh temp "$1" "$2" "$3"
