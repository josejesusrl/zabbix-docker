# Deployment customizations merged on top of docker-compose.yml
# (server.env sets COMPOSE_FILE=docker-compose.yml:compose_server.yaml)
# Volumes are merged by container path, so entries below replace the defaults
# from compose_zabbix_components.yaml and compose_databases.yaml.
services:
 zabbix-server:
# Trapper port receives active checks from local agent 2 (network_mode: host) and remote agents.
# Set ZABBIX_SERVER_BIND_IP=127.0.0.1 in server.env to accept only local agent 2.
  ports: !override
   - name: zabbix-trapper
     target: 10051
     published: "${ZABBIX_SERVER_PORT}"
     host_ip: "${ZABBIX_SERVER_BIND_IP:-0.0.0.0}"
     protocol: tcp
     app_protocol: zabbix-trapper
  volumes:
   - snmptraps:/var/lib/zabbix/snmptraps:rw
   - ./alertscripts:/usr/lib/zabbix/alertscripts:ro
   - ./externalscripts:/usr/lib/zabbix/externalscripts:ro

 zabbix-web-nginx-pgsql:
# HTTPS is enabled by the image when ssl.crt, ssl.key and dhparam.pem exist
# in ${DATA_DIRECTORY}/etc/ssl/nginx (see server_certificate.sh).
# HTTP virtual host only redirects to HTTPS.
# Published ports are for LAN access only: public access goes through cloudflared, no NAT port forwarding.
  volumes:
   - ./nginx/zabbix_http.conf:/etc/zabbix/nginx.conf:ro

 zabbix-snmptraps:
# Accept traps only with community from server_setup.sh
  volumes:
   - ./snmptraps/snmptrapd.conf:/etc/snmp/snmptrapd.conf:ro

 zabbix-web-service:
# Used only by Zabbix server through backend network, do not publish on host
  ports: !reset []

 zabbix-agent:
# Agent 2 without isolation to monitor the host itself
# With host network Zabbix server reaches the agent via frontend gateway (172.16.238.1:10050)
  user: root
  privileged: true
  pid: "host"
  network_mode: "host"
  networks: !reset {}
  ports: !reset []
  volumes:
   - /:/rootfs:ro
   - /sys:/sys:ro
   - /dev:/dev:ro
   - /var/run/docker.sock:/var/run/docker.sock:ro
   - ./zabbix_agentd.d:/etc/zabbix/zabbix_agentd.d:ro
# Report host operating system instead of container one (system.sw.os)
   - /etc/os-release:/etc/os-release:ro

 cloudflared:
# Cloudflare Tunnel: outbound connection to Cloudflare, public hostname and Access are configured
# in Cloudflare dashboard (docs/despliegue/acceso-externo.md). No published ports.
# Metrics and /ready on port 2000 are read by Zabbix server through frontend network.
# Image entrypoint already runs "cloudflared --no-autoupdate".
  image: "cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG}"
  command: tunnel --metrics 0.0.0.0:2000 run --token-file /run/secrets/CLOUDFLARE_TUNNEL_TOKEN
  profiles:
   - postgres-nginx
  restart: "${RESTART_POLICY}"
  depends_on:
   - zabbix-web-nginx-pgsql
  secrets:
   - CLOUDFLARE_TUNNEL_TOKEN
  networks:
   frontend:
    aliases:
     - cloudflared
  healthcheck:
   test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
   interval: 30s
   timeout: 5s
   retries: 3
   start_period: 30s

 postgres-server:
  volumes:
   - ./zabbix-db-data:/var/lib/postgresql/data:rw

secrets:
# Tunnel token, created by server_setup.sh (owner 65532, cloudflared image user), never in git
  CLOUDFLARE_TUNNEL_TOKEN:
    file: ${ENV_VARS_DIRECTORY}/.CLOUDFLARE_TUNNEL_TOKEN
